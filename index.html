<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Open Tabs · PodorM</title>
<meta name="description" content="Websites worth keeping open, sorted into knowledge, simulation and news.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>

<header class="top">
  <a href="https://podor.org/" class="back">← podor.org</a>
</header>

<main class="page">
  <section class="intro">
    <h1>Open Tabs</h1>

  </section>

  <div class="window">
    <div id="tabs" class="tabs" role="tablist" aria-label="Categories"></div>
    <div class="chrome">
      <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
      <span id="address" class="address">podor.org/good-pages/</span>
    </div>
    <div id="panel" class="panel" role="tabpanel"></div>
  </div>
</main>

<footer class="foot page">
  <a href="https://podor.org/">Back to podor.org</a>
  <span id="count"></span>
</footer>

<script src="sites.js"></script>
<script src="script.js"></script>
